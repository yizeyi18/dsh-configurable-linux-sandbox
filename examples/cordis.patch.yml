# Profile-level override for the dsh-configurable-linux-sandbox bundle.
#
# The bundle's own cordis.patch.yml inserts the `configurable-sandbox` row and
# disables the built-in `sandbox` and `fs-sandbox` rows. A patch replaces the
# whole config of the row it targets, so restate every field you keep.
#
# Install the bundle first:
#   dsh plugin --profile <name> add dsh-configurable-linux-sandbox
# then merge this file into that profile's cordis.patch.yml.

- id: configurable-sandbox
  config:
    # Extra writable directories outside the workspace. These are read-only
    # when the session runs in `read-only` mode. Entries must be physical
    # paths; symlinked grants are rejected.
    read_write:
      - /home/me/.cache/uv
      - /home/me/projects/shared

    # Extra read-only directories. These stay readable in both modes.
    read_only:
      - /home/me/datasets
      - /var/log

    # Hide these directories behind an empty tmpfs. Deeper read_only or
    # read_write entries still re-expose their own subtrees.
    forbidden:
      - /home/me

    # Character/block device nodes or paths under /dev exposed with
    # --dev-bind. Device access is outside the file modes; keep this minimal.
    dev:
      - /dev/dri

    # Positive timeout for the one functional bwrap probe.
    probeTimeoutMs: 5000
